name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # setup-android cannot install the SDK on the current runners, so the
      # command line tools are installed explicitly first.
      - name: Install the Android command line tools
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
          mv /tmp/cmdline-tools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          # `yes` gets a broken pipe once sdkmanager is done, so pipefail is off.
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          set -o pipefail
      - name: Install the SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          # The gates need both, and the action does not install them for a
          # pinned toolchain on its own.
          components: rustfmt, clippy
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "android-app"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - name: Check the Rust bridge
        run: cargo fmt --all --check && cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run the Rust tests
        run: cargo test --workspace --locked
      - name: Build the Rust library
        run: |
          cargo ndk -t arm64-v8a -o android/app/src/main/jniLibs build --release -p moviebox-android
          cargo ndk -t x86_64  -o android/app/src/main/jniLibs build --release -p moviebox-android
      - name: Build the debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: moviebox-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
