[package]
name = "moviebox-android"
version = "0.1.0"
edition = "2024"
description = "JNI bridge exposing the MovieBox core engine to the Android app."
license = "GPL-3.0-or-later"

[lib]
name = "moviebox_android"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
# The core lives in the MovieBox repository and is consumed as a git
# dependency, so the app builds without a crates.io release of it.
moviebox-tui = { git = "https://github.com/manish0467/MovieBox-Tui", tag = "v0.1.31", default-features = false }
jni = "0.21"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "fs", "io-util", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "stream"] }
log = "0.4.33"
